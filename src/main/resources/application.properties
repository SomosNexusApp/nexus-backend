spring.application.name=nexus
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# =============================================================================
# RENDER FREE PLAN — Optimizaciones de arranque y memoria
# =============================================================================
spring.main.lazy-initialization=true
spring.jmx.enabled=false

# Tomcat — reducir threads para 0.1 CPU / 500 MB RAM
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.connection-timeout=10000

# Compresion HTTP — reducir trafico de red
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# =============================================================================
# BASE DE DATOS PostgreSQL
# En produccion (Render) sobreescribe estas variables en el dashboard:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DBNAME
#   SPRING_DATASOURCE_USERNAME=DB_USER
#   SPRING_DATASOURCE_PASSWORD=DB_PASSWORD
#
# IMPORTANTE sobre Render:
#   - La "Internal Database URL" (dpg-xxx-a) solo funciona si el backend
#     y la BD estan en el mismo proyecto/region de Render.
#   - Usa la "External Database URL" si el backend no esta en Render, o si
#     la conexion interna falla. El formato externo es:
#       postgresql://USER:PASS@dpg-xxx.oregon-postgres.render.com:5432/DBNAME
#   - En el dashboard de Render > Environment > Add Environment Variable:
#       Key:   SPRING_DATASOURCE_URL
#       Value: jdbc:postgresql://dpg-xxx.oregon-postgres.render.com:5432/DBNAME
#              (pon el prefijo jdbc: delante de la URL de Render)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — pool minimo + tolerancia a reconexiones en Render (la BD puede arrancar lenta)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA base
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate — batching y desactivar caches innecesarias
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# =============================================================================
# MULTIPART (imagenes, audios, videos)
# =============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

