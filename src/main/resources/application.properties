# =============================================================================
# TOKENS DE VERIFICACION (minutos)
# =============================================================================
nexus.password-reset.expiry-minutes=15
nexus.verification.expiry-minutes=30
nexus.two-factor-email.expiry-minutes=10

# Caducidad anuncios (dias) y plazo envio tras pago (dias)
nexus.anuncio.vida-dias=180
nexus.envio.plazo-dias=10

# =============================================================================
# NEWSLETTER
# =============================================================================
nexus.newsletter.version-politica=1.0

# =============================================================================
# SCHEDULER
# =============================================================================
# Recalculo cada 15 min para reducir carga de CPU en Render Free (era 5 min)
nexus.upvotes.recalculo-minutos=15

# =============================================================================
# ASYNC THREAD POOL — minimo viable para Render Free
# =============================================================================
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=3
spring.task.execution.pool.queue-capacity=50
spring.task.execution.pool.keep-alive=30s
spring.task.scheduling.pool.size=1

# =============================================================================
# WEBSOCKET — reducir buffers de mensajes
# =============================================================================
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# =============================================================================
# SWAGGER / OPENAPI
# =============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=WARN
logging.level.com.nexus=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
# Silencia los "constraint X does not exist, skipping" de Hibernate en BD nueva (inofensivos)
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

# =============================================================================
# JACKSON — serialización optimizada
# =============================================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
# Fechas como timestamp numerico (mas ligero que ISO-8601 string)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# =============================================================================
# ACTUATOR — desactivado en prod para no consumir memoria extra
# =============================================================================
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health

# =============================================================================
