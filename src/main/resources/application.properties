spring.application.name=nexus
server.port=${PORT:8080}

# =============================================================================
# BASE DE DATOS PostgreSQL
# En produccion (Render) sobreescribe estas variables en el dashboard:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DBNAME
#   SPRING_DATASOURCE_USERNAME=DB_USER
#   SPRING_DATASOURCE_PASSWORD=DB_PASSWORD
#
# IMPORTANTE sobre Render:
#   - La "Internal Database URL" (dpg-xxx-a) solo funciona si el backend
#     y la BD estan en el mismo proyecto/region de Render.
#   - Usa la "External Database URL" si el backend no esta en Render, o si
#     la conexion interna falla. El formato externo es:
#       postgresql://USER:PASS@dpg-xxx.oregon-postgres.render.com:5432/DBNAME
#   - En el dashboard de Render > Environment > Add Environment Variable:
#       Key:   SPRING_DATASOURCE_URL
#       Value: jdbc:postgresql://dpg-xxx.oregon-postgres.render.com:5432/DBNAME
#              (pon el prefijo jdbc: delante de la URL de Render)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — tolerancia a reconexiones en Render (la BD puede arrancar lenta)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

