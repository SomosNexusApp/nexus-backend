# =============================================================================
# BASE DE DATOS PostgreSQL
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=nexus
spring.config.import=optional:classpath:application-secrets.properties
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# =============================================================================
# RENDER FREE PLAN — Optimizaciones de arranque y memoria (0.1 vCPU / 512 MB RAM)
# =============================================================================
spring.main.lazy-initialization=false
spring.jmx.enabled=false

# Tomcat — ajustado para 0.1 vCPU / 512 MB RAM
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=30
server.tomcat.connection-timeout=8000
# Keep-alive HTTP: reutilizar la conexion TCP en peticiones consecutivas (clave para movil)
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=50

# Compresion HTTP — comprimir desde 512 bytes para abarcar mas respuestas de la API
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# HikariCP — falla rapido (8 s) y mantiene 2 conexiones calientes para evitar cold-start en BD
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.leak-detection-threshold=60000
# Nombre del pool para identificarlo en logs
spring.datasource.hikari.pool-name=NexusPool

# JPA base
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate — batching, fetch_size y caches desactivadas
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.jdbc.fetch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# Evitar N+1 en asociaciones lazy — modo estricto
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# =============================================================================
# MULTIPART (imagenes, audios, videos)
# =============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

